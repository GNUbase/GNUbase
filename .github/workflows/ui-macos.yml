# SPDX-License-Identifier: GPL-3.0-or-later
# The window tests (ctest label ui) on Apple Silicon, where SDL_GPU draws through Metal. CI's macOS job runs on an Intel
# runner, whose virtual GPU SDL_GPU can't use, because hosted Apple Silicon runners often never pick jobs up. For the
# same reason this workflow runs only on main (and by hand), not on pull requests, which it would leave waiting. While
# CI's macOS job is paused, it is also the only macOS build: a failure on main opens an issue, or comments on the open
# one. Authors of rendering or window changes can run it on their branch before merging (docs/features/ui-tests.md).
name: UI tests (macOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A merge cancels the run on main that is still testing the merge before it, on purpose: it frees one of the few macOS
# runners for the newest commit. During a busy stretch of merges no run may finish until merging stops; without the
# cancel, a run waiting for a runner that never comes would hold back the next one.
concurrency:
  group: ui-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # tools/report-ci-failure.sh

jobs:
  ui-macos-arm64:
    # Without a compiler cache every run builds from scratch: 49 and 58 minutes of building on 2026-11-24 (#2063), so the
    # old 60 min limit cancelled a run before its tests, which take another 15.
    timeout-minutes: 120
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Every build needs the VST3 SDK's interfaces (the plugin host's VST3 adapter), which the recursive checkout
      # skips, as in ci.yml.
      - name: Fetch the VST3 SDK
        run: |
          git submodule update --init --checkout ext/vst3sdk
          git -C ext/vst3sdk submodule update --init base cmake pluginterfaces public.sdk

      - name: Fetch golden images and fonts
        run: git lfs pull --include "tests/golden/ui/**,resources/fonts/**"

      - name: Install packages
        timeout-minutes: 15
        run: brew install ninja

      # Only the arm64 slice, and no test plugins, which aren't part of the window tests.
      - name: Configure
        run: cmake --preset macos -DCMAKE_OSX_ARCHITECTURES=arm64 -DGNUBASE_TEST_PLUGINS=OFF

      - name: Build
        run: cmake --build --preset macos --config Release --target gnubase-tests

      - name: Test
        env:
          GNUBASE_REQUIRE_GPU: 1
        run: ctest --preset macos -C Release -L ui

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-ui-macos-arm64
          path: build/macos/tests/output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report the failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/report-ci-failure.sh "UI tests (macOS) fail on main"
