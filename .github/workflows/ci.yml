# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # SDL's documented Ubuntu build dependencies (ext/SDL/docs/README-linux.md) without the optional extras, and Mesa's
  # software Vulkan driver (lavapipe), which the window tests draw through (tests/window_tests.cpp).
  LINUX_PACKAGES: >-
    ninja-build ccache
    libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
    libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev
    libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
    libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev
    libvulkan1 mesa-vulkan-drivers
  # Compiler caches: only pushes to main save them, and pull requests restore main's latest. A pull request's own would
  # only push main's out of the repository's 10 GB of Actions cache, as no other pull request can restore them. Each job
  # caps its cache (CCACHE_MAXSIZE, SCCACHE_CACHE_SIZE) at what one of its builds fills, or a little more, so that one
  # push's caches take about 6 of the 10 GB. Each push to main saves them under new keys, and GitHub evicts the least
  # recently used once the 10 GB are full, so main's latest caches stay. The jobs zero their cache statistics after
  # restoring the cache and print them after building, so they show this build's hits and misses to check the caps
  # against. In Nov 2026 the linux-x64-gcc and windows-x64 caches held a whole build, and the sanitizer and clang-tidy
  # caps were raised from ones that missed 7 to 42 % of a build that changed no compiled code. SDL and RmlUi compile
  # with precompiled headers, which neither ccache nor sccache can cache, so CI builds without them.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_LAUNCHER: >-
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
  # Windows caches with sccache, in the same folder and cache entry as ccache elsewhere.
  SCCACHE_DIR: ${{ github.workspace }}/.ccache
  SCCACHE_LAUNCHER: >-
    -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

jobs:
  build:
    timeout-minutes: 60
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read # main's API references, for the step "API reference changes"
    # The ID of the API reference pages the Linux job uploaded, for publish-api-reference. Only that job sets it, and
    # an empty value from another matrix job doesn't override it.
    outputs:
      pages-artifact: ${{ steps.upload-pages.outputs.artifact_id }}
    env:
      CCACHE_MAXSIZE: ${{ matrix.cache }}
      SCCACHE_CACHE_SIZE: ${{ matrix.cache }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ninja instead of the Visual Studio generator, which ignores compiler launchers, so sccache can cache.
          - { name: windows-x64, runner: windows-2025, preset: windows-x64-ninja, arch: x64, cache: 800M }
          - { name: linux-x64-gcc, runner: ubuntu-24.04, preset: linux-gcc, cache: 1500M }
          # ponytail: paused while many pull requests are open at once, so each run takes fewer of GitHub's 20 concurrent
          # jobs; Clang still builds in the sanitizer and clang-tidy jobs. macOS builds only in ui-macos.yml, after a
          # merge, and only the arm64 slice of gnubase-tests without the test plugins, running only the ui tests. A
          # macOS-only failure there (Objective-C++, libc++, Metal) passes every pull request check and first fails on
          # main, where tools/report-ci-failure.sh opens an issue for it. A macOS-only failure anywhere else fails
          # nowhere: in the other tests (CoreAudio [unit], CoreMIDI [integration]), the test plugins or the x86_64
          # slice. Bringing back macos-universal, whose Intel runners do pick jobs up, restores that coverage first. To
          # restore, uncomment them and add their names back to the required checks of the ruleset "main: CI must pass".
          # - { name: windows-arm64, runner: windows-11-arm, preset: windows-arm64-ninja, arch: arm64, cache: 800M }
          # Intel runner because hosted macOS arm64 runners often never pick jobs up (they are cancelled after 15
          # minutes). Builds both slices, tests the x86_64 one; the window tests run on Apple Silicon in ui-macos.yml.
          # Move back to macos-15 (arm64) before Intel images retire in 2027.
          # - { name: macos-universal, runner: macos-15-intel, preset: macos, cache: 1500M }
          # - { name: linux-x64-clang, runner: ubuntu-24.04, preset: linux-clang, cache: 1G }
          # - { name: linux-arm64-gcc, runner: ubuntu-24.04-arm, preset: linux-gcc, cache: 1500M }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The recursive checkout skips the VST3 SDK (update = none in .gitmodules). Only the parts GNUbase builds with,
      # without the SDK's documentation, tutorials and GUI library (docs/dependencies.md).
      - name: Fetch the VST3 SDK
        run: |
          git submodule update --init --checkout ext/vst3sdk
          git -C ext/vst3sdk submodule update --init base cmake pluginterfaces public.sdk

      # Only what the tests read (test data, golden files and the fonts), not every image in Git LFS.
      - name: Fetch test data and fonts
        run: git lfs pull --include "tests/data/**,tests/golden/**,resources/fonts/**"

      - name: Install packages (Linux)
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Install packages (macOS)
        timeout-minutes: 15
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      # No link-time optimization: its link steps took most of the Release builds (about 13 of 18 minutes on Windows),
      # and no compiler cache can skip them. Pull requests restore main's cache, so main builds without it too. lto.yml
      # builds and tests with it once a week.
      - name: Configure
        shell: bash
        run: >-
          cmake --preset ${{ matrix.preset }} -DGNUBASE_LTO=OFF
          ${{ runner.os == 'Windows' && env.SCCACHE_LAUNCHER || env.CCACHE_LAUNCHER }}

      # ccache keeps its statistics in the cache folder, so without this they would add up over every build since the
      # cache was first created. sccache's start with its server.
      - name: Zero the compiler cache statistics
        if: runner.os != 'Windows'
        run: ccache --zero-stats

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Compiler cache statistics
        if: runner.os != 'Windows'
        run: ccache --show-stats

      # Stopping the server writes out what it still holds before the cache is saved, and prints its statistics.
      - name: Stop sccache (Windows)
        if: runner.os == 'Windows'
        run: sccache --stop-server

      # Before the tests, so that a failing test doesn't lose the build's cache.
      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}

      # A headless sound server with a null sink and source, so that the PipeWire tests open real devices here, and
      # its JACK layer (pipewire-jack) for the JACK tests. GNUBASE_REQUIRE_PIPEWIRE makes them fail instead of skipping
      # when it can't be reached. Other jobs skip them.
      - name: Start PipeWire (Linux)
        if: matrix.name == 'linux-x64-gcc'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends pipewire pipewire-bin pipewire-jack wireplumber dbus-daemon
          tools/start-pipewire.sh >> "$GITHUB_ENV"
          echo "GNUBASE_REQUIRE_PIPEWIRE=1" >> "$GITHUB_ENV"

      # jackd2 with its dummy driver, for the JACK tests. GNUBASE_REQUIRE_JACK makes them fail instead of skipping when
      # it can't be reached. Other jobs skip them.
      - name: Start JACK (Linux)
        if: matrix.name == 'linux-x64-gcc'
        timeout-minutes: 5
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jackd2
          tools/start-jack.sh
          echo "GNUBASE_REQUIRE_JACK=1" >> "$GITHUB_ENV"

      # The ALSA sequencer for the ALSA MIDI tests: snd-seq-dummy loads it and adds the Midi Through port. The runner's
      # kernel has them in linux-modules-extra. GNUBASE_REQUIRE_ALSA_SEQ makes the tests fail instead of skipping once
      # it is loaded; where it can't be, they skip with a warning here. Other jobs skip them.
      - name: Load the ALSA sequencer (Linux)
        if: matrix.name == 'linux-x64-gcc'
        timeout-minutes: 5
        run: |
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              "linux-modules-extra-$(uname -r)" && sudo modprobe snd-seq-dummy; then
            for _ in $(seq 50); do [ -e /dev/snd/seq ] && break; sleep 0.1; done
            if [ -e /dev/snd/seq ]; then
              sudo chmod a+rw /dev/snd/seq
              echo "GNUBASE_REQUIRE_ALSA_SEQ=1" >> "$GITHUB_ENV"
            else
              echo "::warning::/dev/snd/seq didn't appear after loading snd-seq-dummy: the ALSA MIDI tests are skipped"
            fi
          else
            echo "::warning::The ALSA sequencer can't be loaded on this runner: the ALSA MIDI tests are skipped"
          fi

      - name: Test
        # The window tests need SDL_GPU. Every runner has it except the macOS Intel one, whose virtual GPU doesn't meet
        # SDL_GPU's requirements (docs/render-backend.md): there they are skipped, everywhere else a missing GPU fails.
        # Four tests at a time, one per core of the hosted runners; [realtime] tests still run alone (tests/CMakeLists.txt).
        env:
          GNUBASE_REQUIRE_GPU: ${{ runner.os != 'macOS' && '1' || '0' }}
        run: ctest --preset ${{ matrix.preset }} -C Release --parallel 4

      # What failing tests wrote for a look, such as a screenshot that differs from its golden image.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.name }}
          path: build/${{ matrix.preset }}/tests/output/
          if-no-files-found: ignore
          retention-days: 14

      # The generated Lua API reference and MCP tool catalogue, which the unit tests wrote (docs/api-reference.md). The
      # file check fails the job when the tests stopped writing either of them.
      - name: Upload API references
        if: ${{ !cancelled() && matrix.name == 'linux-x64-gcc' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: build/${{ matrix.preset }}/docs/
          if-no-files-found: error
          retention-days: 90
      - name: Check API references
        id: check-references
        if: ${{ !cancelled() && matrix.name == 'linux-x64-gcc' }}
        run: test -s build/${{ matrix.preset }}/docs/lua.md && test -s build/${{ matrix.preset }}/docs/mcp-tools.md

      # The references aren't in a pull request's diff, so its job summary shows how they differ from main's latest.
      - name: API reference changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.name == 'linux-x64-gcc' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest='[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not)
            and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id'
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=api-reference&per_page=100" --jq "$latest")
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n api-reference -D "$RUNNER_TEMP/main-docs"
          {
            echo "## API references compared with main's"
            if diff -ru "$RUNNER_TEMP/main-docs" build/${{ matrix.preset }}/docs > "$RUNNER_TEMP/docs.diff"; then
              echo "No changes."
            else
              echo '```diff'
              head -c 900000 "$RUNNER_TEMP/docs.diff" # the summary's limit is 1 MiB
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # main's references as web pages, which the job publish-api-reference puts on GitHub Pages. Pull requests build
      # the pages too, to find what breaks them before main does. Jekyll renders Markdown with GitHub's flavour; the raw
      # tags keep Liquid out of the references' text.
      - name: Prepare API reference pages
        id: prepare-pages
        if: ${{ !cancelled() && matrix.name == 'linux-x64-gcc' }}
        run: |
          mkdir -p api-pages/source
          {
            echo '# GNUbase API references'
            echo
            echo "Generated from \`main\` by CI ([docs/api-reference.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/api-reference.md))."
            echo
            echo '- [Lua API](lua.html)'
            echo '- [MCP tool catalogue](mcp-tools.html)'
          } > api-pages/source/index.md
          for name in lua mcp-tools; do
            file=build/${{ matrix.preset }}/docs/$name.md
            { head -n 1 "$file"; echo '{% raw %}'; tail -n +2 "$file"; echo '{% endraw %}'; } > "api-pages/source/$name.md"
          done
      - name: Build API reference pages
        id: build-pages
        if: ${{ !cancelled() && matrix.name == 'linux-x64-gcc' }}
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: api-pages/source
          destination: api-pages/site
      # On pushes, also when tests failed: the unit tests write the references whatever the other tests do, and the
      # pages go up only when the references passed their check and both page steps succeeded.
      - name: Upload API reference pages
        id: upload-pages
        if: >-
          ${{ !cancelled() && github.event_name == 'push' && steps.check-references.outcome == 'success'
          && steps.prepare-pages.outcome == 'success' && steps.build-pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: api-pages/site

      # Non-blocking (#24): shared runners vary too much to fail on numbers, so the results are only kept.
      - name: Benchmarks
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: build/${{ matrix.preset }}/bin/Release/gnubase-bench --quick --json benchmarks-${{ matrix.name }}.json

      - name: Upload benchmarks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.name }}
          path: benchmarks-${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: gnubase-${{ matrix.name }}
          path: build/${{ matrix.preset }}/bin/Release/
          retention-days: 14

  # Publishes main's API references on GitHub Pages, the pages the Linux job built (docs/api-reference.md), so they can
  # be read without a build or a GitHub sign-in. Needs the repository's Pages source set to GitHub Actions. Runs once
  # all build jobs ended, whether they passed or failed, when the Linux job uploaded the pages, and is skipped when it
  # uploaded none, so a run without pages leaves the last ones online.
  publish-api-reference:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.outputs.pages-artifact != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  sanitizers:
    timeout-minutes: 90 # asan-ubsan took up to 59 min on main on slow runners in Nov 2026
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests: how many tests run at a time. At four, sanitized exports, freezes and analyses kept the engine busy
          # past its client's 10 s reply limit on slow runners. Three leaves one of the runner's four cores for the
          # tests' own threads; at two, the jobs took 50 to 80 min in Nov 2026.
          - { name: asan-ubsan, sanitizers: "address,undefined", cache: 1600M, tests: 3 }
          - { name: tsan, sanitizers: thread, cache: 1300M, tests: 3 }
    env:
      CCACHE_MAXSIZE: ${{ matrix.cache }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tools/tsan-suppressions.txt
      # Only Mesa's software driver, which the window tests draw through: the Vulkan loader would also load the other
      # drivers of mesa-vulkan-drivers, and the radeon one leaks 128 bytes while it looks for a device (Nov 2026), which
      # failed every UI test under LeakSanitizer.
      # A glob on the manifest's name, which Mesa 25 writes without the architecture (lvp_icd.json).
      VK_LOADER_DRIVERS_SELECT: lvp_icd*
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch the VST3 SDK
        run: |
          git submodule update --init --checkout ext/vst3sdk
          git -C ext/vst3sdk submodule update --init base cmake pluginterfaces public.sdk

      - name: Fetch test data and fonts
        run: git lfs pull --include "tests/data/**,tests/golden/**,resources/fonts/**"

      - name: Install packages
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Allow sanitizer memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28 # newer kernels randomize more address bits than ASan/TSan support

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        run: cmake --preset linux-clang -DGNUBASE_SANITIZERS=${{ matrix.sanitizers }} $CCACHE_LAUNCHER

      - name: Build tests
        run: |
          ccache --zero-stats
          cmake --build --preset linux-clang --target gnubase-tests
          ccache --show-stats

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}

      - name: Test
        env:
          GNUBASE_REQUIRE_GPU: 1
        run: ctest --preset linux-clang --parallel ${{ matrix.tests }}

  clang-tidy:
    timeout-minutes: 90 # main took up to 51 min in Nov 2026; a PR that changes a widely included header takes longer
    runs-on: ubuntu-24.04
    env:
      # 400M held only 58 % of a build: a pull request that changed no compiled code missed 548 of 1309 compiles.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch the VST3 SDK
        run: |
          git submodule update --init --checkout ext/vst3sdk
          git -C ext/vst3sdk submodule update --init base cmake pluginterfaces public.sdk

      - name: Install packages
        timeout-minutes: 15
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
          pipx install clang-tidy==22.1.8 # same major version as Visual Studio 2026 bundles

      # The compiler cache and clang-tidy's passes, so that it checks only what changed (tools/clang-tidy-cache.sh).
      - name: Restore the caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            .tidy-cache
          key: ccache-clang-tidy-${{ github.sha }}
          restore-keys: ccache-clang-tidy-

      - name: Configure
        run: >-
          cmake --preset linux-clang -DGNUBASE_CLANG_TIDY=ON -DGNUBASE_CLANG_TIDY_CACHE=$PWD/.tidy-cache
          $CCACHE_LAUNCHER

      # Keeps only the passes this build used, so the cache doesn't grow with every push. The folder is missing when no
      # file had a key (tools/clang-tidy-cache.sh).
      - name: Build with clang-tidy
        run: |
          touch "$RUNNER_TEMP/build-start"
          ccache --zero-stats
          cmake --build --preset linux-clang
          ccache --show-stats
          mkdir -p .tidy-cache
          find .tidy-cache -type f ! -newer "$RUNNER_TEMP/build-start" -delete

      - name: Save the caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            .ccache
            .tidy-cache
          key: ccache-clang-tidy-${{ github.sha }}

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check license headers
        run: sh tools/check-spdx.sh

      - name: Check the generated themes
        run: | # resources/themes must be what tools/skin/generate.py writes; names the files that differ
          python3 tools/skin/generate.py "$RUNNER_TEMP/themes"
          diff -rq resources/themes "$RUNNER_TEMP/themes"

      - name: Install clang-format
        run: pipx install clang-format==22.1.3 # exactly the version Visual Studio 2026 bundles

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror
